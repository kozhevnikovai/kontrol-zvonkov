name: Ранний доступ к платным возможностям
description: Расскажите, какие возможности из раздела «Скоро» вам нужны — это влияет на порядок разработки
title: "Ранний доступ: "
labels: ["early-access"]
body:
  - type: markdown
    attributes:
      value: "Базовая версия остаётся бесплатной и открытой (MIT). Здесь — заявки на возможности, которых пока нет. Не пишите в заявке персональные данные и коммерческие тайны: страница публичная."
  - type: checkboxes
    attributes:
      label: Что вам нужно
      options:
        - label: "Облачный кабинет без своего сервера"
        - label: "Доступ с телефона для руководителя"
        - label: "Другая телефония или CRM (напишите какая)"
        - label: "Оценка звонков в реальном времени и подсказки менеджеру"
  - type: input
    attributes: {label: Размер команды, placeholder: "например: 6 менеджеров, 300 звонков в день"}
  - type: textarea
    attributes: {label: Какую задачу хотите решить, description: "Чем конкретнее, тем лучше"}
