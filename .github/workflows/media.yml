name: media
# Съёмка интерфейса на открытых телефонных разговорах DataHive (CC BY 4.0) с оценкой локальной моделью
on:
  workflow_dispatch:
  push:
    branches: ['media/**']
    paths: ['.github/workflows/media.yml', 'scripts/media/**']
permissions: { contents: write }
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env: { ZVONKI_HOME: /home/runner/kz, ZVONKI_GPU: cpu, ZVONKI_OUT: /home/runner/kz-out, ZVONKI_DATA: /home/runner/kz/calls }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build
      - uses: actions/cache@v6
        with: { path: ~/kz/models, key: "llm-qwen3-4b-v1" }
      - run: node dist/cli.js models --model qwen3-4b
      - run: npx playwright-core install ffmpeg
      - run: node scripts/media/capture.mjs --prepare
      - name: Разбор звонков с оценкой (CLI, Qwen3 4B)
        run: node dist/cli.js import "$ZVONKI_DATA" --export media/raw/выгрузка.csv
      - run: xvfb-run -a -s "-screen 0 1920x1080x24" node scripts/media/capture.mjs
      - name: Отчёты HTML/XLSX для витрины
        if: always()
        run: node dist/cli.js report --from 2000-01-01 --to 2100-01-01 --format html,xlsx --out media/reports || true
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: media, path: "media/" }
      # результат — в отдельную ветку media-out/<номер запуска> (скачать артефакт без входа в GitHub нельзя)
      - name: Кадры в ветку media-out
        if: always()
        run: |
          git config user.name "github-actions[bot]" && git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "media-out/${{ github.run_id }}" && git rm -rq --cached . && mkdir -p out
          cp media/*.png out/ 2>/dev/null || true; cp media/raw/app.webm media/raw/timing.json out/ 2>/dev/null || true; cp -r media/reports out/ 2>/dev/null || true
          git add -f out && git commit -qm "media: кадры запуска ${{ github.run_id }}" && git push -q origin "media-out/${{ github.run_id }}"
